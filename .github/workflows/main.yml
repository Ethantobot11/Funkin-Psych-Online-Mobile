# This is a basic workflow to help you get started with Actions

name: Build


# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, experimental ]
    tags: [ "*" ]
  pull_request:
    branches: [ main, experimental ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildAndroid:
   runs-on: ubuntu-latest

   steps:
         - name: Retrieve Cache
           uses: actions/cache@v4
           with:
            path: |
              export/release/android/haxe
              export/release/android/obj
            key: ${{ runner.os }}-cache

         - uses: krdlab/setup-haxe@master
           with:
              haxe-version: 4.3.2
      
         - name: Setup Java JDK
           uses: actions/setup-java@v2
           with:
              distribution: 'temurin'
              java-version: '11'

         - name: Setup Android NDK
           uses: nttld/setup-ndk@v1
           id: setup-ndk
           with:
             ndk-version: r21e
      
  #     # Runs a set of commands using the runners shell
         - name: Install Haxelib
           run: |
            sudo apt-get install libvlc-dev
            sudo apt-get install libvlccore-dev
            haxelib setup ~/haxelib
            haxelib install hxcpp > /dev/null --quiet
            haxelib install hmm --quiet
            haxelib run hmm install
            haxelib run lime config ANDROID_SDK $ANDROID_HOME
            haxelib run lime config ANDROID_NDK_ROOT ${{steps.setup-ndk.outputs.ndk-path}}
            haxelib run lime config JAVA_HOME $JAVA_HOME
            haxelib run lime config ANDROID_SETUP true

         - name: Create Version Tag
           run: echo "${{github.run_id}}" > VERSION
         - name: Compile
           run: haxelib run lime build Project.xml android -D HXCPP_M64 --app-version="4.0.0-${{ github.run_id}}"
         - name: Publish Artifact
           uses: actions/upload-artifact@v4
           with:
             name: androidBuild
             path: 'export/release/android/bin/app/build/outputs/apk'
